---
- name: Install base packages on Debian
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - bash
      - procps
      - psmisc
    update_cache: true
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Install base packages on RedHat
  ansible.builtin.raw: >
    sh -c 'dnf install -y curl ca-certificates procps-ng psmisc shadow-utils ||
    yum install -y curl ca-certificates procps-ng psmisc shadow-utils'
  changed_when: false
  when: ansible_facts['os_family'] == "RedHat"

- name: Create Vector config directory
  ansible.builtin.file:
    path: "{{ vector_config_dir }}"
    state: directory
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: "0755"

- name: Create Vector data directory
  ansible.builtin.file:
    path: "{{ vector_data_dir }}"
    state: directory
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: "0755"

- name: Install Vector via official installer
  ansible.builtin.shell: |
    set -euo pipefail
    if [ ! -x /root/.vector/bin/vector ] && ! command -v vector >/dev/null 2>&1; then
      curl --proto '=https' --tlsv1.2 -sSfL https://sh.vector.dev | env VECTOR_VERSION={{ vector_version }} bash -s -- -y
    fi
  args:
    executable: /bin/bash
  changed_when: false

- name: Create symlink for vector binary
  ansible.builtin.file:
    src: /root/.vector/bin/vector
    dest: /usr/local/bin/vector
    state: link
    force: true

- name: Ensure vector binary is available
  ansible.builtin.shell: |
    PATH=/root/.vector/bin:/usr/local/bin:/usr/bin:/bin:$PATH
    command -v vector
    vector --version
  args:
    executable: /bin/bash
  changed_when: false

- name: Put Vector config
  ansible.builtin.copy:
    dest: "{{ vector_config_file }}"
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: "0644"
    content: "{{ vector_config | to_nice_yaml(indent=2) }}"
  notify: Restart vector

- name: Stop old Vector process if exists
  ansible.builtin.shell: |
    pkill -f 'vector --config {{ vector_config_file }}' || true
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false

- name: Start Vector in background
  ansible.builtin.shell: |
    {{ vector_start_command }}
  args:
    executable: /bin/bash
  changed_when: false

- name: Wait for Vector process start
  ansible.builtin.shell: |
    PATH=/root/.vector/bin:/usr/local/bin:/usr/bin:/bin:$PATH
    pgrep -f 'vector --config {{ vector_config_file }}'
  register: vector_process_check
  retries: 10
  delay: 2
  until: vector_process_check.rc == 0
  changed_when: false
